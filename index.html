<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Óticas LN. Cada olhar revela sua essência única.">
  <meta name="theme-color" content="#13211f">
  <title>Óticas LN | Cada olhar revela sua essência única.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="bio-page">
    <div class="ambient-shape ambient-shape-one"></div>
    <div class="ambient-shape ambient-shape-two"></div>

    <!-- Perfil principal da loja -->
    <section class="profile" aria-labelledby="store-name">
      <div class="logo-frame">
        <img id="store-logo" src="images/LUNAI.jpg" alt="Logo Óticas LN">
      </div>
      <p class="profile-label">ótica contemporânea</p>
      <h1 id="store-name">Óticas LN</h1>
      <p class="tagline" id="store-tagline">Cada olhar revela sua essência única.</p>
    </section>

    <!-- Links editáveis configurados no script.js -->
    <nav class="contact-list" aria-label="Canais de contato da Óticas LN">
      <a class="contact-button contact-whatsapp" data-contact="whatsapp" href="#" target="_blank" rel="noopener">
        <span class="button-icon"><i data-lucide="message-circle"></i></span>
        <span>Fale conosco pelo WhatsApp</span>
        <i class="button-arrow" data-lucide="arrow-up-right"></i>
      </a>
      <a class="contact-button" data-contact="facebook" href="#" target="_blank" rel="noopener">
        <span class="button-icon"><i data-lucide="facebook"></i></span>
        <span>Siga a Óticas LN no Facebook</span>
        <i class="button-arrow" data-lucide="arrow-up-right"></i>
      </a>
      <a class="contact-button" href="avaliacoes.html">
        <span class="button-icon"><i data-lucide="heart"></i></span>
        <span>Veja as avaliações dos nossos clientes</span>
        <i class="button-arrow" data-lucide="arrow-up-right"></i>
      </a>
    </nav>

    <p class="availability"><span></span> atendimento próximo, do seu jeito</p>
  </main>

  <footer class="site-footer">
    <strong id="footer-name">Óticas LN</strong>
    <span>© <span id="footer-year">2026</span> Óticas LN — Todos os direitos reservados.</span>
  </footer>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="script.js"></script>
</body>
</html>
